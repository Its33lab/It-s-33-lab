<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>It's 33 Lab · 轉職工具</title>
<meta name="description" content="轉職系列影片用到的工具，都在這裡。免費、不用留 email。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">

<style>
:root{
  --bg:#f7f1e6; --bg2:#efe6d5; --card:#fffaf1;
  --ink:#4a4137; --muted:#8d8069; --line:#3a322a; --hair:#e0d4bd;
  --khaki:#a98f5f; --rose:#c88e73; --sage:#7d9877;
  --on-accent:#fffaf1;
  --serif:"Noto Serif TC",Georgia,"PingFang TC","Microsoft JhengHei",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#221d18; --bg2:#1b1712; --card:#2e2721;
    --ink:#f2ead9; --muted:#a2957f; --line:#7a6a55; --hair:#463c31;
    --khaki:#c8ab77; --rose:#dda98d; --sage:#9dba95;
    --on-accent:#221d18;
  }
}
:root[data-theme="dark"]{
  --bg:#221d18; --bg2:#1b1712; --card:#2e2721;
  --ink:#f2ead9; --muted:#a2957f; --line:#7a6a55; --hair:#463c31;
  --khaki:#c8ab77; --rose:#dda98d; --sage:#9dba95;
  --on-accent:#221d18;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;
  background-image:
    linear-gradient(rgba(169,143,95,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(169,143,95,.10) 1px,transparent 1px);
  background-size:32px 32px;
}
.wrap{max-width:680px;margin:0 auto;padding:0 18px 72px}
header{padding:56px 0 34px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand svg{width:38px;height:38px}
.brand span{font-weight:900;font-size:19px;letter-spacing:.01em}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,6.5vw,40px);
  line-height:1.25;margin:0 0 12px;text-wrap:balance}
.lede{color:var(--muted);font-size:16.5px;margin:0;max-width:32em}

.tool{display:block;text-decoration:none;color:inherit;
  background:var(--card);border:2.5px solid var(--line);border-radius:16px;
  box-shadow:6px 6px 0 var(--line);padding:22px 20px;margin-top:26px;
  transition:transform .14s,box-shadow .14s}
.tool:hover,.tool:focus-visible{transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--line)}
.tool:focus-visible{outline:2.5px solid var(--rose);outline-offset:4px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.16em;color:var(--khaki)}
.tool h2{font-family:var(--serif);font-weight:700;font-size:23px;margin:8px 0 8px}
.tool p{margin:0;color:var(--muted);font-size:15.5px}
.go{display:inline-block;margin-top:14px;font-weight:700;font-size:15px;color:var(--rose)}

.soon{margin-top:26px;border:2.5px dashed var(--hair);border-radius:16px;
  padding:20px;color:var(--muted);font-size:15.5px}
.soon b{color:var(--ink);font-weight:700}

footer{margin-top:46px;padding-top:22px;border-top:1.5px solid var(--hair);
  color:var(--muted);font-size:13.5px}
footer a{color:var(--khaki)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="24 20 54 40" aria-hidden="true">
        <path d="M50 46 C40 30 26 30 28 46" fill="#5f7a59"/>
        <path d="M50 46 C60 28 76 30 72 48" fill="#8ea988"/>
        <path d="M50 52 C46 36 50 26 52 24" stroke="#5f7a59" stroke-width="5" fill="none" stroke-linecap="round"/>
      </svg>
      <span>It's 33 Lab</span>
    </div>
    <h1>轉職工具</h1>
    <p class="lede">影片裡用到的表格跟工具，都放在這裡。
       全部免費、不用留 email，手機打開就能用。</p>
  </header>

  <a class="tool" href="ep5.html">
    <div class="eyebrow">EP5</div>
    <h2>現有工作 vs 新工作　評量表</h2>
    <p>五個面向各打一次分數，照你最在意的排序，算出真正該看的那兩列。
       填到一半可以關掉，答案會留在你的裝置上。</p>
    <span class="go">開始填 →</span>
  </a>

  <div class="soon">
    <b>EP6 的工具準備中。</b>最後一集會講怎麼做轉職的功課、
    怎麼把前五集想清楚的東西變成實際行動。
  </div>

  <footer>
    It's 33 Lab · 轉職系列<br>
    這些工具不會蒐集你的任何資料，填寫內容只留在你自己的瀏覽器裡。
  </footer>
</div>
